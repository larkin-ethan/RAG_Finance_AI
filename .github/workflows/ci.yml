name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    services:
      postgres:  # real pgvector, so the DB integration tests run instead of skipping
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finrag
          POSTGRES_PASSWORD: finrag
          POSTGRES_DB: finrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finrag" --health-interval 5s --health-retries 10
    env:
      SEC_USER_AGENT: "FinRAG CI ci@example.com"
      TEST_DATABASE_URL: postgresql://finrag:finrag@localhost:5432/finrag
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra ml
      - run: uv run ruff check src tests ui
      - run: uv run ruff format --check src tests ui
      - run: uv run pytest -q -rs

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - name: Known-vulnerable dependencies (pip-audit on the lock file)
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit==2.9.0 --strict -r requirements.txt
      - name: Kubernetes manifest misconfigurations (Trivy, HIGH/CRITICAL fail)
        run: |
          docker run --rm -v "$PWD/deploy/k8s:/k8s:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            config --exit-code 1 --severity HIGH,CRITICAL /k8s/base
      - name: No plaintext secrets committed
        run: |
          ! git grep -nIE 'BEGIN [A-Z ]*PRIVATE KEY|AGE-SECRET-KEY[-]|postgresql://[^:/]+:[^@$]{12,}@' -- ':!*.enc.yaml'
          if [ -f deploy/k8s/overlays/local/secrets.enc.yaml ]; then
            grep -q 'ENC\[' deploy/k8s/overlays/local/secrets.enc.yaml
          fi

  retrieval-eval:
    name: Retrieval eval (no LLM)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finrag
          POSTGRES_PASSWORD: finrag
          POSTGRES_DB: finrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finrag" --health-interval 5s --health-retries 10
    env:
      SEC_USER_AGENT: "FinRAG CI ci@example.com"
      DATABASE_URL: postgresql://finrag:finrag@localhost:5432/finrag
      EMBED_PROVIDER: local
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Download eval index (release "eval-index")
        id: index
        run: |
          if gh release download eval-index --pattern 'finrag-index.tsv.gz' --dir . 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No 'eval-index' release yet; skipping the retrieval eval. See evals/README.md."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.index.outputs.found == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - if: steps.index.outputs.found == 'true'
        uses: actions/cache@v4  # the 1.2 GB embedding model
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-embedding-0.6b
      - if: steps.index.outputs.found == 'true'
        run: |
          uv sync --frozen --extra ml
          uv run python -m finrag.evals.index import finrag-index.tsv.gz
          uv run python -m finrag.evals.run --name ci --split dev --mode retrieval
          uv run python -m finrag.evals.gate evals/results/ci-dev.json evals/baseline_retrieval.json
