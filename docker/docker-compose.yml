# Local Postgres with pgvector. Run from repo root: make db
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: finrag
      POSTGRES_DB: finrag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
