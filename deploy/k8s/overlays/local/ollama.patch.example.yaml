# up.sh writes ollama.patch.yaml like this, with the address pods use to reach
# Ollama on the Windows host. Shown here for reference only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clients-to-ollama
  namespace: finrag
spec:
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.65.254/32
      ports:
        - {protocol: TCP, port: 11434}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finrag-config
  namespace: finrag
data:
  OLLAMA_URL: http://192.168.65.254:11434
