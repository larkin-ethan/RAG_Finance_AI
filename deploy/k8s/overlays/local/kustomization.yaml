# Private local deployment. Secrets are NOT here: up.sh decrypts
# secrets.enc.yaml (SOPS + age) and applies it separately.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: finrag-local
    newTag: IMAGE_TAG   # set by up.sh (git commit) via `kustomize edit`-style sed into a temp copy
configMapGenerator:
  - name: finrag-config
    namespace: finrag
    literals:
      - PUBLIC_DEMO=false
      - RATINGS_ENABLED=true
      - LLM_PROVIDER=ollama
      - EMBED_PROVIDER=ollama
      - OLLAMA_MODEL=qwen3:14b
      - OLLAMA_JUDGE_MODEL=gemma3:12b
      - OLLAMA_EMBED_MODEL=qwen3-embedding:0.6b
      - WATCHLIST_PATH=/app/config/private/holdings.yaml
      - HTTPS_PROXY=http://egress-proxy:3128
      - NO_PROXY=postgres,api,ui,localhost,127.0.0.1,.svc,.cluster.local,host.k3d.internal,host.docker.internal
patches:
  - path: ollama.patch.yaml   # generated by up.sh from the detected host address (gitignored)
