apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data   # embedding + LLM response caches
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups    # age-encrypted database dumps
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
