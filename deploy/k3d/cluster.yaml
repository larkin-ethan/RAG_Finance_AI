# k3d cluster for the private deployment. Created by deploy/k8s/up.sh, which
# substitutes ${FINRAG_STORAGE} (host folder for all volumes, so data lives on
# your BitLocker-encrypted disk and survives cluster re-creation).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: finrag
servers: 1
agents: 0
image: rancher/k3s:v1.36.5-k3s1@sha256:057cfd5a9d51b89f1f0ee139c28d5d5fdd5aa7ddeac2742a0ba90c6dbc0329bb
kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"   # API server reachable from this machine only
  hostPort: "6445"
ports:
  - port: 127.0.0.1:8443:443   # HTTPS ingress, loopback only; no port 80 at all
    nodeFilters:
      - loadbalancer
volumes:
  - volume: ${FINRAG_STORAGE}:/var/lib/rancher/k3s/storage
    nodeFilters:
      - server:0
options:
  k3s:
    extraArgs:
      - arg: --secrets-encryption   # encrypt Secrets at rest in the datastore
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
