[project]
name = "finrag"
version = "0.1.0"
description = "Cited Q&A over SEC filings with a rigorous eval suite"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.27",
    "lxml>=6.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0",
    "streamlit>=1.65.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# In-process ML: local sentence-transformers embeddings and the cross-encoder
# reranker. Needed for dev, the GPU pipeline, and the Cloud Run image. The private
# k8s image skips it: Ollama serves embeddings there (no PyTorch in the container).
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.7",  # direct dep so [tool.uv.sources] can pick CUDA/CPU builds per OS
    "transformers>=4.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

# PyTorch builds per platform:
#   Windows -> CUDA 12.8 build (RTX 50-series/Blackwell GPUs need CUDA 12.8+).
#   Linux   -> CPU-only build: the deploy target is Cloud Run (no GPU), and PyPI's
#              default Linux wheel bundles ~2.5 GB of CUDA libraries we'd never use.
#   macOS   -> PyPI's regular wheel (supports the Apple-silicon GPU via MPS).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
